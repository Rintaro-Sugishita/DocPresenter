# Publishes the web viewer (packages/app-web) to this repository's GitHub Pages:
# https://rintaro-sugishita.github.io/DocPresenter/view.html?src=<address on GitHub>
# See design/web-viewer.md. Pages must be set to deploy from GitHub Actions.
name: Web viewer

on:
  push:
    branches: [claude/docpresenter-service-6rm7u3]
    paths:
      - 'packages/**'
      - 'themes/**'
      - 'tools/build-web-viewer.mjs'
      - 'tools/web-shell/**'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --build
      - run: npx vitest run packages/app-web
      - run: node tools/build-web-viewer.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}view.html
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
