<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  /* Portrait by default; one named page turned landscape for a wide table. */
  @page            { size: A4 portrait;  margin: 20mm; }
  @page landscape  { size: A4 landscape; margin: 15mm; }

  .landscape { page: landscape; break-before: page; break-after: page; }

  body { font-family: "Noto Sans CJK JP", sans-serif; font-size: 10pt; line-height: 1.8; }
  h2   { break-before: page; }
  table { border-collapse: collapse; width: 100%; font-size: 9pt; }
  th, td { border: 1px solid #666; padding: 3px 6px; }
  thead th { background: #eee; }
</style></head>
<body>
  <h2>1 概要</h2>
  <p>本書は認証機能の設計を示す。ページは既定で A4 縦とする。</p>

  <h2>2 画面項目</h2>
  <p>項目定義を次ページに示す。横長のため用紙を横向きにする。</p>

  <figure class="landscape">
    <table>
      <thead><tr>
        <th>分類</th><th>No</th><th>項目名</th><th>物理名</th><th>型</th><th>必須</th>
        <th>初期値</th><th>桁数</th><th>入力規則</th><th>備考</th><th>関連画面</th><th>更新日</th>
      </tr></thead>
      <tbody>
        <script>/* rows injected below */</script>
      </tbody>
    </table>
    <figcaption>表 1 ログイン画面 項目定義</figcaption>
  </figure>

  <h2>3 トークン管理</h2>
  <p>縦向きに戻ることを確認する。</p>

  <script>
    const tb = document.querySelector('tbody');
    for (let i = 1; i <= 40; i++) {
      tb.insertAdjacentHTML('beforeend',
        `<tr><td>入力</td><td>${i}</td><td>項目${i}</td><td>field_${i}</td><td>varchar(64)</td>
         <td>○</td><td>—</td><td>64</td><td>半角英数字のみ</td><td>備考テキスト${i}</td>
         <td>ログイン画面</td><td>2026-09-21</td></tr>`);
    }
  </script>
</body></html>
